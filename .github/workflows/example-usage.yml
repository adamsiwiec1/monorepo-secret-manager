# Example GitHub Action for projects using monorepo-secret-manager
# Copy this to your project's .github/workflows/ directory

name: Example CI/CD with Monorepo Secret Manager

on:
  push:
    branches: [foo, bar]
  pull_request:
    branches: [foo, bar]

jobs:
  deploy-staging:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Install Monorepo Secret Manager
        run: |
          npm install -g monorepo-secret-manager@latest
          npm install -g @google-cloud/secret-manager

      - name: Download staging environments
        run: msm pull -e staging --write-targets --ambient-creds

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Deploy to staging
        run: npm run deploy:staging

  deploy-production:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: deploy-staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT_PROD }}

      - name: Install Monorepo Secret Manager
        run: |
          npm install -g monorepo-secret-manager@latest
          npm install -g @google-cloud/secret-manager

      - name: Download production environments
        run: msm pull -e production --write-targets --ambient-creds

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Deploy to production
        run: npm run deploy:production
